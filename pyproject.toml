[project]
name = "findex"
version = "0.7.0"
description = "Пошукова система по корпусу текстів: інвертований індекс, BM25 і TF-IDF, булеві запити з фразами"
readme = "README.md"
authors = [
    { name = "k2s-tempo", email = "wilkzokay@gmail.com" }
]
requires-python = ">=3.11"
keywords = ["search", "inverted-index", "bm25", "tf-idf", "cli"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "numpy>=2.4.6",
    "pydantic-settings>=2.16.3",
    "rich>=15.0.0",
    "typer>=0.29.0",
    "uvicorn[standard]>=0.54.0",
]

[project.urls]
Repository = "https://github.com/k2s-tempo/findex"

[project.scripts]
findex = "findex.cli:app"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "matplotlib>=3.11.2",
    "psutil>=7.2.2",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-benchmark>=5.3.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # довгі рядки з українськими коментарями дозволені

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "-ra --strict-markers"
markers = [
    'slow: тести довші за ~1 с (пропустити: -m "not slow")',
]

[tool.coverage.run]
source = ["findex"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_also = [
    'if __name__ == .__main__.:',
    'raise NotImplementedError',
    '^\s*\.\.\.$',
]
