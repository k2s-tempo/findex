name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v8.1.0
      - name: Install dependencies
        run: uv sync --locked --python ${{ matrix.python-version }}
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run pyright
      - run: uv run pytest -q --cov=findex --cov-report=term-missing
      - name: Бенчмарки (pytest-benchmark, лише Python 3.12)
        if: matrix.python-version == '3.12'
        run: uv run pytest tests/test_benchmarks.py --benchmark-enable --benchmark-only --benchmark-sort=name --benchmark-json=benchmark.json
      - name: Збереження результатів бенчмарків
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark
          path: benchmark.json
